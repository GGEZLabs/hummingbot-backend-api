name: hummingbot-api
channels:
  - conda-forge
dependencies:
  # --- API Framework Dependencies ---
  - python=3.12
  - fastapi
  - uvicorn
  - boto3
  - python-dotenv
  - docker-py
  - pip

  # --- Hummingbot Core Dependencies ---
  # These are needed by the hummingbot package at runtime
  - pandas>=2.0.3
  - numpy<2.0.0
  - sqlalchemy>=2.0.0
  - aiohttp>=3.8.5
  - ujson>=5.7.0
  - requests>=2.31.0
  - pyjwt>=2.3.0
  - prompt_toolkit>=3.0.39
  - setuptools
  - cython>=3.0.0
  - conda-build>=3.26.0
  - asyncssh>=2.13.2
  - aioprocessing>=2.0.1
  - bidict>=0.22.1
  - cachetools>=5.3.1
  - cryptography>=41.0.2
  - eth-account>=0.13.0
  - pydantic>=2
  - pyjwt>=2.3.0
  - ruamel.yaml>=0.2.5
  - tabulate>=0.9.0
  - urllib3>=1.26.15,<2.0
  - web3
  - async_timeout
  - base58
  - scipy>=1.11.1
  - autopep8
  - bip-utils
  - commlib-py>=0.11
  - coverage>=7.2.7
  - diff-cover>=7.7.0
  - flake8>=6.0.0
  - injective-py==1.10.*
  - msgpack-python
  - objgraph
  - pandas-ta>=0.3.14b
  - pre-commit>=3.3.3
  - protobuf>=4.23.3
  - psutil>=5.9.5
  - ptpython>3.0.25
  - pytest>=7.4.0
  - pytest-asyncio>=0.16.0
  - pyperclip>=1.8.2
  - rust
  - safe-pysha3
  - scalecodec
  - six>=1.16.0
  - xrpl-py==4.1.0
  - yaml>=0.2.5
  - zlib>=1.2.13

  - pip:
      # --- API Pip-only Dependencies ---
      - paho-mqtt
      - aiomqtt>=2.0.0
      - asyncpg
      - psycopg2-binary
      - greenlet
      - pydantic-settings
      - logfire[fastapi,system-metrics]
